<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e13'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%234aa8ff'/%3E%3C/svg%3E">
<script>
/* 主题要在首次绘制前定好，免得先闪一下再变色 */
(function () {
  var m = document.cookie.match(/(?:^|;\s*)theme=(dark|light)/);
  var saved = m ? m[1] : null;
  /* cookie 拿不到时（比如用 file:// 直接打开）退回 localStorage */
  if (!saved) {
    try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
  }
  if (saved !== 'dark' && saved !== 'light') saved = null;
  var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  var useLight = saved === 'light' || (saved !== 'dark' && light);
  document.documentElement.setAttribute('data-site-theme', useLight ? 'light' : 'dark');
})();
</script>
<link rel="stylesheet" href="assets/css/style.css?v=11">
</head>

                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

        </svg>
